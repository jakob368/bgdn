<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bygden">
<meta name="robots" content="noindex">
<title>Bygden Kollega</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#15130F; --surface:#211E18; --surface-2:#2B2720; --line:#3A352C;
  --ink:#F3ECDD; --ink-2:#B8AF9C; --ink-3:#7E7666;
  --green:#3FB868; --green-ink:#0E1A12; --brand:#00802B; --ochre:#E2A648; --berry:#D2634A;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#0E0D0A;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* desktop: phone frame; mobile: full bleed */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:14px}
.note{color:#6E685B;font-size:13px;max-width:420px;text-align:center;line-height:1.4}
.note b{color:#9A9282;font-weight:600}
.phone{width:100%;max-width:412px;height:860px;max-height:calc(100vh - 100px);background:var(--ground);border-radius:40px;border:1px solid #2A2720;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px #0A0908;overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:520px){
  .stage{padding:0;min-height:100dvh}
  .note{display:none}
  .phone{max-width:none;height:100dvh;max-height:none;border-radius:0;border:0;box-shadow:none}
}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 0 92px;scroll-behavior:smooth}
.screen::-webkit-scrollbar{display:none}

/* top */
.home-hero{position:relative;padding-bottom:6px;background:var(--hero-bg,linear-gradient(180deg,#26301F 0%,#1B2117 45%,var(--ground) 100%))}
.home-hero .img{position:absolute;inset:0;background-size:135%;background-position:52% -90px;background-repeat:no-repeat;opacity:.85}
.home-hero .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,19,15,.2) 0%,rgba(21,19,15,.15) 40%,rgba(21,19,15,.8) 68%,var(--ground) 100%)}
.home-hero > *:not(.img){position:relative}
.home-hero h1,.home-hero .lead{text-shadow:0 2px 14px rgba(0,0,0,.6)}
.top{padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark img{height:22px;width:auto;display:block}
.wordmark{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:14px;text-align:left}
.wordmark small{display:block;font-family:var(--body);font-weight:500;letter-spacing:.06em;font-size:10px;color:var(--ink);opacity:.85;margin-top:3px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ochre);color:var(--green-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:500;padding:6px 0}
.back svg{width:16px;height:16px}

/* type */
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lead{color:var(--ink-2);font-size:16px;margin:0}
p{margin:0}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.prose p{color:var(--ink-2)}
.prose p strong{color:var(--ink);font-weight:600}
.prose h3{margin-top:10px;color:var(--ink)}
.pad{padding:0 20px}
.sec{display:flex;flex-direction:column;gap:12px;padding:0 20px;margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between}
.sec-head a,.sec-head button{color:var(--green);font-size:13px;font-weight:600}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ink-3)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink-3)}

/* hero card "Är du ny" */
.hero{margin:0 20px;background:linear-gradient(160deg,#1E3324 0%,#182219 60%,#1A1912 100%);border:1px solid #2C4632;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(63,184,104,.25),transparent)}
.hero h2{font-size:26px}
.progress{height:6px;border-radius:3px;background:#2A3A2E;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s ease}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:var(--green-ink);font-weight:700;font-size:15px;padding:13px 18px;border-radius:999px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}

/* entry grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;display:flex;flex-direction:column;gap:22px;text-align:left;min-height:118px;transition:background .15s}
.tile:active{background:var(--surface-2)}
.tile .ic{width:30px;height:30px;color:var(--green)}
.tile .ic svg{width:30px;height:30px}
.tile b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;display:block}
.tile span{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.tile.wide .ic{width:26px;height:26px}
.tile.wide .ic svg{width:26px;height:26px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.row .chev{color:var(--ink-3);width:16px;height:16px;flex:none}
.row .cat{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--green);flex:none}
.row .cat svg{width:18px;height:18px}
.row .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.chip.new{border-color:var(--ochre);color:var(--ochre)}
.chip.done{border-color:var(--green);color:var(--green)}

/* steps in a rutin */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--green);font-family:var(--display);font-weight:700;font-size:14px;display:grid;place-items:center}
.step p{color:var(--ink-2)}
.step p b{color:var(--ink);font-weight:600}
.stamp{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px}
.stamp i{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* film placeholder */
.film{aspect-ratio:16/9;border-radius:var(--r);background:
  repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.03) 14px 28px),
  linear-gradient(160deg,#2A2519,#1B1913);border:1px dashed #4A4436;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);text-align:center;padding:16px}
.film .play{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center}
.film .play svg{width:20px;height:20px;margin-left:3px}
.film b{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.film span{font-size:12.5px}

/* intro flow */
.flowbar{display:flex;gap:4px;padding:0 20px;margin-top:14px}
.flowbar i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.flowbar i.on{background:var(--green)}
.flowbar i.cur{background:var(--ochre)}
.quote{border-left:3px solid var(--ochre);padding:6px 0 6px 16px;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25;color:var(--ink);letter-spacing:-.01em}
.quote small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-3);margin-top:8px;font-weight:500}
.values{display:flex;flex-direction:column;gap:10px}
.value{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.value b{font-family:var(--display);font-weight:700;font-size:17px;display:block;margin-bottom:4px}
.value p{color:var(--ink-2);font-size:14.5px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol .value b{font-size:15px}
.twocol .value p{font-size:13.5px}
.check{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.check input{appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);flex:none;margin-top:1px;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--green);border-color:var(--green)}
.check input:checked::after{content:"";width:12px;height:7px;border-left:3px solid var(--green-ink);border-bottom:3px solid var(--green-ink);transform:rotate(-45deg) translate(1px,-1px)}
.check label{font-size:15px;line-height:1.4}
.footer-nav{display:flex;gap:10px;padding:24px 20px 0}
.footer-nav .btn{flex:1}
.receipt{margin:0 20px;background:linear-gradient(160deg,#1E3324,#1A1912);border:1px solid #2C4632;border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.receipt .big{width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center}
.receipt .big svg{width:26px;height:26px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0;font-size:14px}
.receipt dt{color:var(--ink-3)}
.receipt dd{margin:0;font-variant-numeric:tabular-nums}

/* people */
.person{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.person .ph img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.person .ph{width:64px;height:64px;border-radius:14px;flex:none;overflow:hidden;background:linear-gradient(160deg,#3A4A3A,#22281F);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--ochre)}
.person b{font-family:var(--display);font-weight:700;font-size:17px;display:block}
.person span{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.person p{color:var(--ink-2);font-size:14px;margin-top:6px}

/* contacts */
.contact{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none}
.contact:first-child{border-top:0}
.contact .t{flex:1;min-width:0}
.contact .t b{display:block;font-weight:600}
.contact .t span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.contact .call{width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--green);display:grid;place-items:center;flex:none}
.contact .call svg{width:18px;height:18px}
.contact.urgent .call{background:var(--berry);color:#fff}

/* search results */
.results{display:flex;flex-direction:column;gap:18px}
.results .grp{display:flex;flex-direction:column;gap:8px}
.results mark{background:none;color:var(--ochre);font-weight:600}
.empty{color:var(--ink-3);text-align:center;padding:30px 0;font-size:14.5px}

/* profile */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-3);font-size:13px}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;background:rgba(21,19,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:6px 0;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green)}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.view{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.progress i{transition:none}}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="toast" id="toast"></div>
  </div>
  <p class="note"><b>Mockup för diskussion.</b> Texterna är exempel i Bygdens ton, inte färdigt innehåll. Öppna på mobilen för rätt känsla – allt är klickbart.</p>
</div>

<script>
/* ---------- ikoner ---------- */
const I = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',

  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 9 10 4 20 4c0 10-5 16-16 16z"/><path d="M4 20c4-5 8-8 12-10"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>',

  call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',

  bowl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',

  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',

const OM_BYGDEN = `
<div class="film"><div class="play">${I.play}</div><b>Bygden på två minuter</b><span>Film · platshållare</span></div>
<div class="prose">
<p>Bygden ligger i Bildmuseet vid älven i Umeå. Vi öppnade med en enkel tanke: att lunch mitt i veckan kan vara det bästa som händer den dagen.</p>
<h3>Maten</h3>
<p>Kreativa sallader, wraps och riktigt gott fika. Allt lagas från grunden i restaurangen. Vi väljer råvaror med omsorg och lyfter det lokala – rökt fisk från Piteå, Västerbottensost, bröd från bagerier i stan. Dagens soppa byts varje dag.</p>
<h3>Hållbarhet</h3>
<p>Vi strävar efter hållbarhet i alla led och gör det enkelt för gästen att göra ett bra val. Det betyder små portioner av det som är dyrt för planeten, mycket av det som växer nära, och så lite svinn vi kan.</p>
<h3>Vart vi är på väg</h3>
<p>Vi vill att Bygden ska finnas på fler ställen än Umeå. Därför är det viktigt att det vi gör här går att förklara och lära ut – det är därför den här appen finns.</p>
</div>`;

/* ---------- state ---------- */
const state = load();
function load(){ try{ return Object.assign({intro:[],signed:null}, JSON.parse(localStorage.getItem('bygden-mock')||'{}')); }catch(e){ return {intro:[],signed:null}; } }
function save(){ try{ localStorage.setItem('bygden-mock', JSON.stringify(state)); }catch(e){} }
function introDone(){ return INTRO.filter(s=>s.id!=='kvittens').filter(s=>state.intro.includes(s.id)).length; }

/* ---------- router ---------- */
const screen = document.getElementById('screen');
const tabsEl = document.getElementById('tabs');
const TABS = [
  {id:'home', n:'Hem', ic:I.home},
  {id:'rutiner', n:'Rutiner', ic:I.book},
  {id:'sok', n:'Sök', ic:I.search},
  {id:'kontakter', n:'Kontakt', ic:I.phone},
  {id:'jag', n:'Jag', ic:I.user},
];
function go(route){ location.hash = route; }
function route(){
  const h = (location.hash||'#home').slice(1).split('/');
  const view = VIEWS[h[0]] || VIEWS.home;
  screen.innerHTML = `<div class="view">${view(h[1],h[2])}</div>`;
  screen.scrollTop = 0;
  const tab = {home:'home',intro:'home',om:'home',agare:'home',rutiner:'rutiner',rutin:'rutiner',faq:'rutiner',sok:'sok',kontakter:'kontakter',jag:'jag'}[h[0]]||'home';
  tabsEl.innerHTML = TABS.map(t=>`<button class="tab ${t.id===tab?'on':''}" onclick="go('${t.id}')">${t.ic}<span>${t.n}</span></button>`).join('');
  const inp = screen.querySelector('input[type=search]'); if(inp && h[0]==='sok') inp.focus();
}
window.addEventListener('hashchange', route);

/* ---------- helpers ---------- */
const hdr = (back, backTo) => `<div class="top">${back?`<button class="back" onclick="go('${backTo||'home'}')">${I.back}${back}</button>`:`<button class="wordmark" onclick="go('home')" aria-label="Till startsidan"><img src="${LOGO}" alt="Bygden"><small>${USER.site.toUpperCase()}</small></button>`}<button class="avatar" onclick="go('jag')" aria-label="Min sida">${USER.name[0]}</button></div>`;
const rutinRow = r => `<button class="row" onclick="go('rutin/${r.id}')"><div class="cat">${RUTIN_KAT.find(k=>k.id===r.kat).ic}</div><div class="t"><b>${r.t}</b><span>${r.s}</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`;
const contactRow = c => `<a class="contact ${c.urgent?'urgent':''}" href="tel:${c.tel.replace(/[^0-9+]/g,'')}"><div class="t"><b>${c.n}</b><span>${c.r}</span></div><span class="n" style="font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px">${c.tel}</span><div class="call">${I.call}</div></a>`;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- vyer ---------- */
const VIEWS = {
  home(){
    const done = introDone(), total = INTRO.length-1;
    const signed = !!state.signed;
    const next = INTRO.find(s=>!state.intro.includes(s.id)) || INTRO[INTRO.length-1];
    const hour = new Date().getHours();
    const greet = hour<10?'God morgon':hour<17?'Hej':'God kväll';
    return `<div class="home-hero">${HERO_IMG?`<div class="img" style="background-image:url('${HERO_IMG}')"></div>`:''}${hdr()}
    <div class="pad" style="margin-top:${HERO_IMG?170:64}px;display:flex;flex-direction:column;gap:6px">
      <h1>${greet}, ${USER.name}!</h1>
      <p class="lead">${signed?'Allt du behöver för passet finns här.':'Du är ny hos oss – börja här nere.'}</p>
    </div>
    <div class="pad" style="margin-top:18px"><button class="search" onclick="go('sok')">${I.search}<span style="flex:1;text-align:left">Sök rutiner, frågor, kontakter…</span></button></div></div>
    ${signed ? `
    <div class="sec"><div class="sec-head"><span class="eyebrow">Nytt sedan sist</span><button onclick="go('rutiner')">Alla rutiner</button></div>
      <div class="list">${RUTINER.filter(r=>['klagomal','oppna'].includes(r.id)).map(rutinRow).join('')}</div></div>
    ` : `
    <div class="hero" style="margin-top:22px">
      <span class="eyebrow" style="color:var(--green)">Är du ny? Börja här</span>
      <h2>${done===0?'Lär känna Bygden på en kvart':'Fortsätt där du var'}</h2>
      <div class="progress"><i style="width:${Math.round(done/total*100)}%"></i></div>
      <div class="meta"><span>${done} av ${total} steg klara</span><span>~${Math.max(2,(total-done)*2)} min kvar</span></div>
      <button class="btn" onclick="go('intro/${next.id}')">${done===0?'Sätt igång':'Fortsätt: '+next.t}</button>
    </div>`}
    <div class="sec"><span class="eyebrow">Hitta</span>
      <div class="grid">
        <button class="tile" onclick="go('rutiner')"><div class="ic">${I.list}</div><div><b>Rutiner</b><span>Så gör vi – steg för steg</span></div></button>
        <button class="tile" onclick="go('faq')"><div class="ic">${I.q}</div><div><b>Frågor &amp; svar</b><span>Det alla undrar</span></div></button>
        <button class="tile" onclick="go('om')"><div class="ic">${I.leaf}</div><div><b>Vad är Bygden</b><span>Idén, maten, vart vi ska</span></div></button>
        <button class="tile" onclick="go('agare')"><div class="ic">${I.people}</div><div><b>Vilka vi är</b><span>Grundare och delägare</span></div></button>
        <button class="tile wide" onclick="go('kontakter')"><div class="ic">${I.phone}</div><div><b>Viktiga nummer</b><span>Per, jour, vaktmästeri, 112</span></div>${I.chev.replace('<svg','<svg class="chev" style="width:18px;height:18px;color:var(--ink-3)"')}</button>
      </div></div>
    ${signed?'':`<div class="sec"><span class="eyebrow">Första veckan</span><div class="list">${RUTINER.filter(r=>['oppna','allergen','swish'].includes(r.id)).map(rutinRow).join('')}</div></div>`}
    <div class="sec" style="margin-bottom:8px"><p style="color:var(--ink-3);font-size:12.5px">Innehållet uppdateras av Per. Du får ett mejl när något viktigt ändras.</p></div>`;
  },

  intro(id){
    const idx = Math.max(0, INTRO.findIndex(s=>s.id===id)); const s = INTRO[idx];
    const bar = INTRO.map((x,i)=>`<i class="${i<idx||state.intro.includes(x.id)?'on':''} ${i===idx?'cur':''}"></i>`).join('');
    const prev = INTRO[idx-1], next = INTRO[idx+1];
    let body = s.body;
    if(s.id==='kvittens'){
      const done = introDone(), total = INTRO.length-1;
      body = state.signed ? `
        <div class="receipt" style="margin:0">
          <div class="big">${I.check}</div>
          <h2>Tack, ${USER.name}.</h2>
          <p class="lead">Du har gått igenom introduktionen och kvitterat att du läst den.</p>
          <dl><dt>Kvitterat</dt><dd>${state.signed}</dd><dt>Restaurang</dt><dd>${USER.site}</dd><dt>Version</dt><dd>Introduktion 1.0 · sep 2026</dd></dl>
        </div>
        <button class="btn block" onclick="go('home')">Till startsidan</button>` : `
        <div class="prose"><p>Du har gått igenom ${done} av ${total} steg. Kvittensen gäller det som handlar om vilka vi är: Bygden, service, värderingar och förväntningar. Den sparas på ditt konto och syns för Per.</p><p>Om vi ändrar något väsentligt i de delarna får du ett mejl och kan bli ombedd att kvittera igen.</p></div>
        <div class="check"><input type="checkbox" id="kv" ${done<total?'disabled':''} onchange="document.getElementById('kvbtn').disabled=!this.checked"><label for="kv">Jag har läst och förstått hur vi tänker på Bygden, och vad vi förväntar oss av varandra.</label></div>
        ${done<total?`<p style="color:var(--ochre);font-size:13.5px">Du behöver gå igenom alla steg först – ${total-done} kvar.</p>`:''}
        <button class="btn block" id="kvbtn" disabled onclick="sign()">Kvittera</button>`;
    }
    return `${hdr('Introduktion','home')}<div class="flowbar">${bar}</div>
    <div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${s.eyebrow}</span><h1 style="font-size:30px">${s.t}</h1></div>
    <div class="pad" style="margin-top:20px;display:flex;flex-direction:column;gap:18px">${body}</div>
    ${s.id==='kvittens'?'':`<div class="footer-nav">${prev?`<button class="btn ghost" onclick="go('intro/${prev.id}')">Tillbaka</button>`:''}<button class="btn" onclick="doneStep('${s.id}','${next?next.id:'kvittens'}')">${next&&next.id!=='kvittens'?'Nästa':'Till kvittensen'}</button></div>`}`;
  },

  rutiner(){
    return `${hdr()}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><h1>Rutiner</h1><p class="lead">Så gör vi hos oss. Uppdateras av Per.</p></div>
    <div class="pad" style="margin-top:18px"><button class="search" onclick="go('sok')">${I.search}<span style="flex:1;text-align:left">Sök en rutin…</span></button></div>
    <div class="sec"><span class="eyebrow">Kategorier</span><div class="list">${RUTIN_KAT.map(k=>{const n=k.id==='faq'?FAQ.length:RUTINER.filter(r=>r.kat===k.id).length;return `<button class="row" onclick="go('${k.id==='faq'?'faq':'rutiner/'+k.id}')"><div class="cat">${k.ic}</div><div class="t"><b>${k.n}</b><span>${k.d}</span></div><span class="n">${n}</span>${I.chev.replace('<svg','<svg class="chev"')}</button>`}).join('')}</div></div>
    <div class="sec"><div class="sec-head"><span class="eyebrow">Senast ändrade</span></div><div class="list">${[...RUTINER].sort((a,b)=>b.upd.localeCompare(a.upd)).slice(0,3).map(rutinRow).join('')}</div></div>`;
  },

  rutin(id){
    if(RUTIN_KAT.find(k=>k.id===id)){ const k=RUTIN_KAT.find(k=>k.id===id); const list=RUTINER.filter(r=>r.kat===id);
      return `${hdr('Rutiner','rutiner')}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${k.d}</span><h1>${k.n}</h1></div>
      <div class="sec">${list.length?`<div class="list">${list.map(rutinRow).join('')}</div>`:`<p class="empty">Inga rutiner här ännu. Per lägger till.</p>`}</div>`; }
    const r = RUTINER.find(r=>r.id===id); if(!r) return VIEWS.rutiner();
    const k = RUTIN_KAT.find(k=>k.id===r.kat);
    return `${hdr(k.n,'rutiner/'+k.id)}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${k.n}</span><h1 style="font-size:30px">${r.t}</h1><p class="lead">${r.s}</p><div class="stamp"><i></i>Uppdaterad ${r.upd} av ${r.by}</div></div>
    <div class="pad" style="margin-top:20px"><div class="film" style="aspect-ratio:2/1"><div class="play">${I.play}</div><b>Kort film eller bild</b><span>Valfritt per rutin · platshållare</span></div></div>
    <div class="pad" style="margin-top:8px"><div class="steps">${r.steps.map(s=>`<div class="step"><p>${s}</p></div>`).join('')}</div></div>
    <div class="pad" style="margin-top:16px"><button class="btn ghost block" onclick="toast('Fråga skickad till Per')">Något stämmer inte? Fråga Per</button></div>`;
  },

  faq(){
    return `${hdr('Rutiner','rutiner')}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><h1>Frågor &amp; svar</h1><p class="lead">Det alla undrar den första veckan.</p></div>
    <div class="sec"><div class="values">${FAQ.map(f=>`<div class="value"><b>${f.q}</b><p>${f.a}</p></div>`).join('')}</div></div>
    <div class="pad" style="margin-top:20px"><button class="btn ghost block" onclick="toast('Fråga skickad till Per')">Saknar du en fråga? Skicka den</button></div>`;
  },

  om(){ return `${hdr('Hem','home')}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Vad är Bygden</span><h1>Lunch som blir dagens höjdpunkt</h1></div><div class="pad" style="margin-top:20px;display:flex;flex-direction:column;gap:18px">${OM_BYGDEN}</div>`; },

  agare(){ return `${hdr('Hem','home')}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Vilka vi är</span><h1>Människorna bakom Bygden</h1><p class="lead">Så att du känner igen oss när vi dyker upp.</p></div>
    <div class="pad" style="margin-top:20px"><div class="film"><div class="play">${I.play}</div><b>Träffa ägarna</b><span>Film, 2–3 min · platshållare</span></div></div>
    <div class="sec"><div class="values">${AGARE.map(a=>`<div class="person"><div class="ph">${a.img?`<img src="${a.img}" alt="${a.n}">`:a.i}</div><div><b>${a.n}</b><span>${a.r}</span><p>${a.p}</p></div></div>`).join('')}</div></div>`; },

  kontakter(){ return `${hdr()}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><h1>Viktiga nummer</h1><p class="lead">Tryck för att ringa. Spara Pers nummer i din telefon.</p></div>
    <div class="sec"><div class="list">${KONTAKTER.map(contactRow).join('')}</div></div>
    <div class="sec"><span class="eyebrow">Adress</span><div class="list"><div class="row"><div class="t"><b>Bygden, Bildmuseet</b><span>Östra Strandgatan 30 B, Umeå · Personalingång på baksidan</span></div></div><div class="row"><div class="t"><b>Öppet</b><span>Mån–fre 08–16 · Lör–sön 11–16</span></div></div></div></div>`; },

  sok(q){
    return `${hdr()}<div class="pad" style="margin-top:22px"><h1>Sök</h1></div>
    <div class="pad" style="margin-top:16px"><label class="search">${I.search}<input type="search" placeholder="Bygden Google…" oninput="doSearch(this.value)" autocomplete="off"></label></div>
    <div class="sec" id="res"><p style="color:var(--ink-3);font-size:14px">Söker i rutiner, frågor &amp; svar, kontakter och sidorna om Bygden. Prova "swish", "sjuk" eller "mobil".</p></div>`;
  },

  jag(){ const done=introDone(), total=INTRO.length-1;
    return `${hdr('Hem','home')}<div class="pad" style="margin-top:22px;display:flex;flex-direction:column;gap:6px"><h1>${USER.name}</h1><p class="lead">${USER.site} · Timanställd</p></div>
    <div class="sec"><div class="grid"><div class="stat"><b>${done}/${total}</b><span>Introduktionssteg</span></div><div class="stat"><b>${state.signed?'Ja':'Nej'}</b><span>Kvitterat värderingar</span></div></div></div>
    <div class="sec"><span class="eyebrow">Konto</span><div class="list">
      <div class="row"><div class="t"><b>Introduktion</b><span>${state.signed?'Kvitterad '+state.signed:'Inte kvitterad ännu'}</span></div><span class="chip ${state.signed?'done':'new'}">${state.signed?'Klar':'Pågår'}</span></div>
      <div class="row"><div class="t"><b>Notiser</b><span>Mejl när rutiner eller värderingar ändras</span></div><span class="chip">På</span></div>
      <div class="row"><div class="t"><b>Restaurang</b><span>Styr vilka rutiner och kontakter du ser</span></div><span class="chip">Umeå</span></div>
    </div></div>
    <div class="sec"><span class="eyebrow">Mockup</span><div class="list"><button class="row" onclick="resetMock()"><div class="t"><b>Nollställ introduktionen</b><span>För att visa flödet igen</span></div></button><button class="row" onclick="fakeSign()"><div class="t"><b>Visa som färdig medarbetare</b><span>Startsidan efter kvittens</span></div></button></div></div>`;
  },
};

/* ---------- handlingar ---------- */
function doneStep(id,next){ if(!state.intro.includes(id)) state.intro.push(id); save(); go('intro/'+next); }
function sign(){ state.signed = new Date().toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'}); save(); route(); toast('Kvitterat'); }
function resetMock(){ state.intro=[]; state.signed=null; save(); go('home'); toast('Nollställt'); }
function fakeSign(){ state.intro = INTRO.filter(s=>s.id!=='kvittens').map(s=>s.id); state.signed='9 september 2026'; save(); go('home'); }

function doSearch(q){
  const el = document.getElementById('res'); q = q.trim().toLowerCase();
  if(q.length<2){ el.innerHTML=`<p style="color:var(--ink-3);font-size:14px">Skriv minst två bokstäver.</p>`; return; }
  const hi = s => s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
  const strip = s => s.replace(/<[^>]+>/g,'');
  const r = RUTINER.filter(x=>(x.t+' '+x.s+' '+strip(x.steps.join(' '))).toLowerCase().includes(q));
  const f = FAQ.filter(x=>(x.q+' '+x.a).toLowerCase().includes(q));
  const k = KONTAKTER.filter(x=>(x.n+' '+x.r).toLowerCase().includes(q));
  const o = [['om','Vad är Bygden',strip(OM_BYGDEN)],['agare','Vilka vi är',AGARE.map(a=>a.n+' '+a.r+' '+a.p).join(' ')]].filter(x=>x[2].toLowerCase().includes(q));
  const intro = INTRO.filter(x=>(x.t+' '+strip(x.body)).toLowerCase().includes(q));
  if(!r.length&&!f.length&&!k.length&&!o.length&&!intro.length){ el.innerHTML=`<p class="empty">Inget om "${q}" ännu.<br>Fråga Per så lägger han till det.</p>`; return; }
  const grp=(t,inner)=>inner?`<div class="grp"><span class="eyebrow">${t}</span><div class="list">${inner}</div></div>`:'';
  el.innerHTML = `<div class="results">
    ${grp('Rutiner', r.map(x=>`<button class="row" onclick="go('rutin/${x.id}')"><div class="t"><b>${hi(x.t)}</b><span>${hi(x.s)}</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join(''))}
    ${grp('Frågor & svar', f.map(x=>`<button class="row" onclick="go('faq')"><div class="t"><b>${hi(x.q)}</b><span>${hi(x.a.slice(0,90))}…</span></div></button>`).join(''))}
    ${grp('Kontakter', k.map(contactRow).join(''))}
    ${grp('Om Bygden', o.map(x=>`<button class="row" onclick="go('${x[0]}')"><div class="t"><b>${x[1]}</b></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join(''))}
    ${grp('Introduktionen', intro.map(x=>`<button class="row" onclick="go('intro/${x.id}')"><div class="t"><b>${hi(x.t)}</b><span>${x.eyebrow}</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join(''))}
  </div>`;
}

/* intro-steg med inbäddade listor */
INTRO.find(s=>s.id==='rutiner').body = INTRO.find(s=>s.id==='rutiner').body.replace('<div class="list" id="intro-rutiner"></div>', `<div class="list">${RUTINER.filter(r=>['oppna','stang','swish','allergen'].includes(r.id)).map(rutinRow).join('')}</div>`);
INTRO.find(s=>s.id==='kontakter').body = INTRO.find(s=>s.id==='kontakter').body.replace('<div class="list" id="intro-kontakter"></div>', `<div class="list">${KONTAKTER.filter(c=>['Per Boman','Sjukanmälan','SOS Alarm'].includes(c.n)).map(contactRow).join('')}</div>`);

route();
</script>
